<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who's Your Nutritionist</title>
<meta name="description" content="Nutrition without the nonsense. Evidence in, myths out.">
<meta property="og:title" content="Who's Your Nutritionist">
<meta property="og:description" content="Nutrition without the nonsense. Evidence in, myths out.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#4A2C18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Mulish:wght@300;400&display=swap" rel="stylesheet">
<style>
  /* Brand colours (WYN brand book): Espresso, Warm White, Toffee. */
  :root { --espresso:#4A2C18; --warm-white:#FFFCF7; --toffee:#C4A07A; }

  /* Fonts: Fraunces for the headline (as in the Instagram carousel mock-ups and logo guide),
     Avenir for the small text (Mulish is the web fallback named in the logo guide). */
  * { box-sizing:border-box; margin:0; }
  html { background:var(--espresso); }
  body {
    background:var(--espresso); color:var(--warm-white);
    font-family:"Avenir Next","Avenir","Mulish","Helvetica Neue",Arial,sans-serif;
    min-height:100vh; min-height:100svh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 16px; text-align:center;
  }

  /* The logo is drawn in code (no video, no separate image files): the apostrophe, then the W,
     then the real stacked logo fades in over the drawn mark and takes its place. */
  .logo { display:block; width:min(86vw, 440px, 52vh); height:auto; }
  .logo path {
    fill:none; stroke:var(--toffee); stroke-width:8.6; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:1; stroke-dashoffset:0;
  }
  .logo .apos { animation:draw 1.8s cubic-bezier(.45,0,.25,1) .3s backwards; }
  .logo .w    { animation:draw 2.4s cubic-bezier(.45,0,.25,1) 1.9s backwards; }
  .logo .drawn  { animation:fadeout .4s ease 6s forwards; }   /* only after the real logo is fully in */
  .logo .static { animation:fade 1.1s ease 4.4s backwards; }

  .text { margin-top:clamp(32px, 10.5vh, 80px); animation:rise 1.2s ease 4.9s backwards; }
  h1 {
    font-family:"Fraunces",Georgia,"Times New Roman",serif; font-weight:700;
    font-size:clamp(1.25rem, 3.7vw, 2.05rem); line-height:1.15; letter-spacing:-0.005em;
  }
  .sub {
    margin-top:12px; color:var(--toffee);
    font-size:.8rem; font-weight:400; letter-spacing:.2em; text-transform:uppercase;
  }
  .actions { margin-top:30px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .contact {
    display:inline-block; padding:9px 24px;
    border:1px solid var(--toffee); border-radius:999px;
    color:var(--warm-white); text-decoration:none;
    font-size:.64rem; letter-spacing:.18em; text-transform:uppercase;
    transition:background .2s ease, color .2s ease;
  }
  .contact:hover, .contact:focus-visible { background:var(--toffee); color:var(--espresso); outline:none; }
  .ig { display:inline-flex; padding:10px; color:var(--toffee); transition:color .2s ease; }  /* 44px tap area, icon stays 24px */
  .ig:hover, .ig:focus-visible { color:var(--warm-white); outline:none; }
  .ig svg { width:24px; height:24px; display:block; }

  @keyframes draw { from { stroke-dashoffset:1; } to { stroke-dashoffset:0; } }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes fadeout { from { opacity:1; } to { opacity:0; } }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) {
    .logo .apos, .logo .w, .logo .drawn, .logo .static, .text { animation:none; }
    .logo .drawn { display:none; }
  }
</style>
</head>
